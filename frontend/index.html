<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrgoSim</title>
  <style>
    :root {
      --bg: #eef1f6;
      --card: #ffffff;
      --text: #1c2333;
      --muted: #6b7385;
      --accent: #4f46e5;
      --accent-soft: #e8e7fd;
      --error: #c62828;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header { padding: 20px 28px 4px; }
    header h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.02em; }
    header h1 span { color: var(--accent); }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 0.95rem; }
    main { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px 28px 32px; }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 8px 24px rgba(20, 30, 60, .06);
    }
    .card h2 { margin: 0 0 12px; font-size: 0.8rem; font-weight: 600;
               text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    #jsme_container { border-radius: 10px; overflow: hidden; border: 1px solid #dfe3ec; }
    #viewer { width: 420px; height: 380px; position: relative; border-radius: 10px; overflow: hidden; }
    .row { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
    button {
      font: inherit; cursor: pointer; border: 0; border-radius: 10px;
      padding: 10px 18px; background: var(--accent); color: #fff; font-weight: 600;
    }
    button:hover { filter: brightness(1.08); }
    .seg { display: inline-flex; background: #eef0f6; border-radius: 10px; padding: 3px; margin-top: 14px; }
    .seg button { background: transparent; color: var(--muted); padding: 7px 12px; font-weight: 500; }
    .seg button.active { background: #fff; color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    #status { color: var(--error); min-height: 1.2em; font-size: .9rem; }
  </style>
</head>
<body>
  <header>
    <h1>Orgo<span>Sim</span></h1>
    <p>Draw a molecule and explore it in 3D.</p>
  </header>
  <main>
    <section class="card">
      <h2>1 &middot; Draw</h2>
      <div id="jsme_container"></div>
      <div class="row">
        <button id="show">Show in 3D</button>
        <span id="status"></span>
      </div>
    </section>
    <section class="card">
      <h2>2 &middot; Explore</h2>
      <div id="viewer"></div>
      <div class="seg" id="styles">
        <button data-style="ballstick" class="active">Ball &amp; stick</button>
        <button data-style="stick">Sticks</button>
        <button data-style="spacefill">Space-filling</button>
      </div>
    </section>
  </main>

  <script src="vendor/3dmol/3Dmol-min.js"></script>
  <script src="vendor/jsme/jsme.nocache.js"></script>
  <script>
    let jsmeApplet = null;
    let currentStyle = "ballstick";

    const viewer = $3Dmol.createViewer("viewer", { backgroundColor: "#141a2b" });
    const status = document.getElementById("status");

    // Each style is a 3Dmol style object. "scale" multiplies the van der Waals radius.
    const STYLES = {
      ballstick: { stick: { radius: 0.14 }, sphere: { scale: 0.28 } },
      stick: { stick: { radius: 0.16 } },
      spacefill: { sphere: { scale: 1.0 } },
    };

    function applyStyle() {
      viewer.setStyle({}, STYLES[currentStyle]);
      viewer.render();
    }

    // JSME calls this function by name once it has finished loading.
    function jsmeOnLoad() {
      jsmeApplet = new JSApplet.JSME("jsme_container", "420px", "380px");
    }

    async function showMolecule() {
      status.textContent = "";
      const smiles = jsmeApplet ? jsmeApplet.smiles() : "";
      if (!smiles) {
        status.textContent = "Draw a molecule first.";
        return;
      }
      const response = await fetch("/api/molecule", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ smiles }),
      });
      if (!response.ok) {
        status.textContent = "Could not build that molecule.";
        return;
      }
      const { molblock } = await response.json();
      viewer.clear();
      viewer.addModel(molblock, "sdf");
      applyStyle();
      viewer.zoomTo();
      viewer.render();
    }

    document.getElementById("show").addEventListener("click", showMolecule);

    document.getElementById("styles").addEventListener("click", (event) => {
      const name = event.target.dataset.style;
      if (!name) return;
      currentStyle = name;
      for (const b of document.querySelectorAll("#styles button")) {
        b.classList.toggle("active", b === event.target);
      }
      applyStyle();
    });
  </script>
</body>
</html>
